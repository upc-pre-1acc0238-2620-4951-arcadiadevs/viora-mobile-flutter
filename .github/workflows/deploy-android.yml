# Builds the signed release APK of the Gestor app and distributes it with Firebase App Distribution.
#
# Runs when a release tag is pushed (GitFlow tags have no "v": 0.18.0, 0.19.0, ...) or by hand from the
# Actions tab. Repository secrets it needs (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64        the release keystore (viora-release.jks) encoded in Base64
#   ANDROID_STORE_PASSWORD         keystore password
#   ANDROID_KEY_ALIAS              key alias
#   ANDROID_KEY_PASSWORD           key password
#   FIREBASE_SERVICE_ACCOUNT_KEY   JSON key of a Google Cloud service account with the
#                                  "Firebase App Distribution Admin" role
#   VIORA_MAPBOX_PUBLIC_TOKEN      public Mapbox token (pk.…) for the map
# And one repository variable: FIREBASE_APP_ID, the App ID of the Android app pe.edu.upc.viora.gestor
# registered in the Firebase project.
name: Deploy Android

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes shown to the testers
        required: false
        default: ''

# The job only reads the code: the token GitHub hands it cannot write to the repository.
permissions:
  contents: read

concurrency:
  group: deploy-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TESTER_GROUPS: arcadiadevs-internal
      APK_PATH: build/app/outputs/flutter-apk/app-release.apk
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          cache: true

      - name: Check that the tag matches the pubspec version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' pubspec.yaml)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pubspec.yaml"
            exit 1
          fi

      - name: Get the packages
        run: flutter pub get

      - name: Run the tests
        run: flutter test

      - name: Restore the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The secret ANDROID_KEYSTORE_BASE64 is missing: the APK would be signed with the debug key"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/viora-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/viora-release.jks" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VIORA_MAPBOX_PUBLIC_TOKEN: ${{ secrets.VIORA_MAPBOX_PUBLIC_TOKEN }}
        run: flutter build apk --release --dart-define=VIORA_MAPBOX_PUBLIC_TOKEN="$VIORA_MAPBOX_PUBLIC_TOKEN"

      - name: Verify the APK signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$APK_PATH" | grep -E "certificate (DN|SHA-256 digest)"

      - name: Keep the APK with the run
        uses: actions/upload-artifact@v4
        with:
          name: viora-gestor-${{ github.ref_name }}-release-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Write the release notes
        env:
          MANUAL_NOTES: ${{ inputs.release_notes }}
        run: |
          if [ -n "$MANUAL_NOTES" ]; then
            notes="$MANUAL_NOTES"
          else
            notes="Viora Gestor $GITHUB_REF_NAME"$'\n'"$(git log -1 --format=%s)"
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/release-notes.txt"

      - name: Distribute with Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > "$RUNNER_TEMP/firebase-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
          npx --yes firebase-tools@15.34.0 appdistribution:distribute \
            "$APK_PATH" \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTER_GROUPS" \
            --release-notes-file "$RUNNER_TEMP/release-notes.txt"

      - name: Remove the keys from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/viora-release.jks" "$RUNNER_TEMP/firebase-key.json"
