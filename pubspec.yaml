name: viora
description: "Viora — app móvil Flutter (plataforma de manejo de carga y vecería del olivo)."
publish_to: 'none'
version: 0.4.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  go_router: ^16.0.0
  get_it: ^9.3.0
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.17
  flutter_bloc: ^9.1.1
  http: ^1.6.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter_localizations:
    sdk: flutter
  intl: any
  material_new_shapes: ^1.0.0
  permission_handler: ^12.0.1
  url_launcher: ^6.3.3
  path_drawing: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4
  fake_async: ^1.3.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/licenses/

  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/newsreader_variable.ttf
        - asset: assets/fonts/newsreader_italic_variable.ttf
          style: italic
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto_variable.ttf
