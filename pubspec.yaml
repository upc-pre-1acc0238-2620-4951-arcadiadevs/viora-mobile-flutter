name: viora
description: "Viora — app móvil Flutter (plataforma de manejo de carga y vecería del olivo)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  go_router: ^16.0.0
  flutter_riverpod: ^2.6.1
  get_it: ^8.0.3
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/licenses/

  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/newsreader_variable.ttf
        - asset: assets/fonts/newsreader_italic_variable.ttf
          style: italic
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto_variable.ttf
